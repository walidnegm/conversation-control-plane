# Public extraction manifest — Conversation Control Plane SDK portable slice.
# Source of truth: Bot0 monorepo. Destination: github.com/walidnegm/conversation-control-plane
#
# Public package surface: src/conversation_control_plane/ (NOT top-level api/).
# Sync rewrites monorepo api.services.conversation_control.* → conversation_control_plane.*
# Keep the public surface intentionally small: authority path + host envelopes only
# (no monorepo product lattice / LLM classifiers).

sdk_version: "0.1.0"
contract_doc: docs/epics/conversation-control-plane-sdk.md
public_repo: https://github.com/walidnegm/conversation-control-plane
license: MIT

# Modules copied from monorepo then rewritten into conversation_control_plane/.
# Do NOT include discovery_intent (LLM classifier — host product, not authority path).
modules:
  - api/services/conversation_control/chat_dispatch_contract.py
  - api/services/conversation_control/delivery_order_contract.py
  - api/services/conversation_control/sdk_identity.py
  - api/services/conversation_control/contract.py
  # I3 — the one reading of "did this turn close its task?". The adapter in
  # contract.py calls it, and a host's own sinks should too: three sinks each
  # re-deriving the rule is how a committed build closed its task on one path
  # and stayed open on another (conv_b899a066 / conv_9c5f24a6).
  - api/services/conversation_control/terminal_completion_contract.py
  - api/services/conversation_control/decide.py
  - api/services/conversation_control/dispatch_phase.py
  - api/services/conversation_control/ledger.py
  - api/services/conversation_control/ledger_keys.py
  - api/services/conversation_control/ledger_journal.py
  # ledger_journal hooks this on every journaled event ("every journaled event
  # IS plane movement"). It was NOT in this list, so the sync shipped the caller
  # without the callee: the import raised ModuleNotFoundError, the fail-soft
  # `except Exception: pass` swallowed it, and the SDK's ledger marked nothing
  # for any adopter. The instrument only ever worked inside the monorepo.
  - api/services/conversation_control/plane_movement.py
  # B-240: decide proposes; the host admits at the executing agent's dispatch.
  - api/services/conversation_control/admission_contract.py
  # TC-L: a claimed turn must complete (hollow = spoke + neither plane moved).
  - api/services/conversation_control/claimed_turn_complete_contract.py
  - api/services/conversation_control/ledger_outbox.py
  - api/services/conversation_control/control_payload.py
  - api/services/conversation_control/kind_spec.py
  - api/services/conversation_control/projection_rebuild.py
  - api/services/conversation_control/handoff_guard.py
  - api/services/conversation_control/post_save_setup_entry.py
  - api/services/conversation_control/multi_turn_stream_contract.py
  - api/services/conversation_control/reset_commands.py
  - api/services/conversation_control/failure_modes.py
  # Delivery mode: can this act finish in one leaf, or does it need a loop?
  # "handle (your leaf)" in the host cycle is one phrase for two shapes, and a
  # host had no way to say which an act needs — so an act was routed to a mode
  # that could not complete it and the turn ended on a greeting (conv_f4ae6ec0).
  # Vocabulary + assertion only; the host still owns delivery.
  - api/services/conversation_control/delivery_mode_contract.py
  # Authority boundary for interpreted meaning: cognition proposes, the host
  # grounds, the plane emits. A specialist may consume a grounded declaration
  # but cannot construct one — the constructor requires a turn id and resolved
  # targets, which only grounding produces.
  - api/services/conversation_control/semantic_declaration.py
  # Host envelopes (long-turn / reattach law) — portable, transport-agnostic.
  - api/services/conversation_control/turn_timeout.py
  - api/services/conversation_control/turn_session_discipline.py
  - api/services/conversation_control/session_staleness.py
  # Deferred execution continuity — OperationOutcome.DEFERRED + opaque
  # execution_ref. Not poll/SSE/card UX (host experience plane).
  - api/services/conversation_control/deferred_operation.py

docs:
  - docs/epics/conversation-control-plane-sdk.md
  - docs/epics/conversation-turn-lifecycle-diagram.md
  # Public body lives under extract/.../docs/ (sanitized); monorepo epic is host SoT.
  # Publish script ships extract/docs/conversational-authority-diagnostic-taxonomy.md

public_bundle:
  readme: README.md
  docs:
    - conversation-control-plane-sdk.md
    - conversation-turn-lifecycle-diagram.md
    - conversational-authority-diagnostic-taxonomy.md
    - host-transition-discipline.md
    # Portable cognitive architecture (hand-maintained under extract/.../docs/)
    - conversational-routing-authority-adjudication.md
    # Golden turn + per-stage checklist (publish script already copies this file)
    - turn-capability-lifecycle-checklist.md
  replace_section_15: docs/section-15-public.md
  sanitize_lifecycle: true
  package_root: src/conversation_control_plane
  # Monorepo-only (not published as separate files):
  # - conversation-control-plane-loop-playbook.md  → SDK §3.1
  # - conversation-control-plane-trace-export.md   → SDK §11.1
  # - conversation-control-plane-scale-smoke.md    → SDK §3.1 Q1

# Agentic Power of Action (B-181 S14) — hand-maintained under extract/.../docs.
# The two schemas MUST stay byte-equal to frontend/public/schemas/poa/1.2/
# (the published copies at https://bot0.ai/schemas/poa/1.2/); a regression
# pins it. The app stays in the monorepo; only the schema and the approach
# are public.
agentic_poa:
  readme_section: "## Agentic Power of Action (PoA)"
  docs:
    - agentic-poa-spec-1.2.md
    - agentic-poa-authority-type.md
  schemas:
    - schemas/poa/1.2/grant.schema.json
    - schemas/poa/1.2/authority.schema.json
    - schemas/poa/1.2/test-vectors.json
  schema_source: frontend/public/schemas/poa/1.2/

examples:
  - extract/conversation-control-plane/examples/README.md
  - extract/conversation-control-plane/examples/e2e_host_loop.py
  - extract/conversation-control-plane/examples/cyber_risk_assessment/

regression_pins:
  - extract/conversation-control-plane/tests/
  - regression_suite/test_public_sdk_publish_bundle.py
  - regression_suite/test_decide_turn_control_plane.py
